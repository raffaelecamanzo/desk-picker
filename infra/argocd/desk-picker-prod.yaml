apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: desk-picker-backend-prod
  namespace: argocd
spec:
  project: desk-picker
  source:
    repoURL: https://github.com/example/desk-picker
    targetRevision: main
    path: infra/helm/desk-picker-backend
    helm:
      valueFiles:
        - ../../values/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: desk-picker-prod
  syncPolicy:
    automated: {}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: desk-picker-frontend-prod
  namespace: argocd
spec:
  project: desk-picker
  source:
    repoURL: https://github.com/example/desk-picker
    targetRevision: main
    path: infra/helm/desk-picker-frontend
    helm:
      valueFiles:
        - ../../values/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: desk-picker-prod
  syncPolicy:
    automated: {}
